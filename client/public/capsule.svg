<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="pill">
      <rect x="4" y="10.5" width="24" height="11" rx="5.5" ry="5.5" />
    </clipPath>
  </defs>
  <g transform="rotate(-35 16 16)">
    <!-- capsule body -->
    <g clip-path="url(#pill)">
      <rect x="4" y="10.5" width="12" height="11" fill="#0f6e78" />
      <rect x="16" y="10.5" width="12" height="11" fill="#e7eef0" />
    </g>
    <!-- outline + seam -->
    <rect x="4" y="10.5" width="24" height="11" rx="5.5" ry="5.5"
          fill="none" stroke="#15242a" stroke-width="1.6" />
    <line x1="16" y1="10.5" x2="16" y2="21.5" stroke="#15242a" stroke-width="1.6" />
    <!-- highlight -->
    <rect x="7" y="12.4" width="7" height="2" rx="1" fill="#ffffff" opacity="0.35" />
  </g>
</svg>
