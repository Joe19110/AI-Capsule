# fly.toml app configuration file generated for ai-capsule on 2026-11-27T09:54:57Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ai-capsule'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  COOKIE_SECURE = 'true'
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'ai_capsule_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
